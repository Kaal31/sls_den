name: Windows SLS Integration Tests
on:
  push:
    branches: [windows-preview]
    paths:
      - 'src/sls/**'
      - 'tests/sls_*'
      - '.github/workflows/windows-sls-integration.yml'
      - 'src/steam/backend/steam_install_runner.cpp'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fixture-integration:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Compile native Windows SLS metadata integration tests
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build/windows-sls | Out-Null
          $sources = @('src/sls/manifest_metadata.cpp', 'src/sls/source_catalog.cpp', 'src/sls/source_resolver.cpp', 'src/sls/source_list.cpp', 'src/steam/backend/json.cpp', 'src/sls/config_fix.cpp', 'src/sls/steam_catalog_search.cpp')
          foreach ($case in @('sls_config_fix', 'sls_windows_integration', 'sls_install_metadata', 'sls_source_resolver', 'sls_luatools_auth', 'sls_authorized_depot_plan', 'sls_source_list', 'sls_manifest_metadata', 'sls_install_job_queue', 'sls_added_game_registry')) {
            & clang-cl /nologo /std:c++20 /EHsc /I src "tests/${case}_test.cpp" $sources /Fe:"build/windows-sls/${case}.exe"
            if ($LASTEXITCODE -ne 0) { throw "Compilation failed: $case" }
          }
          & clang-cl /nologo /std:c++20 /EHsc /I src /I third_party/stb tests/sls_zip_inflate_test.cpp src/sls/zip_inflate.cpp $sources /Fe:build/windows-sls/sls_zip_inflate.exe
          if ($LASTEXITCODE -ne 0) { throw "Compilation failed: sls_zip_inflate" }
      - name: Verify fallback, ownership boundaries and source configuration
        shell: pwsh
        run: |
          foreach ($case in @('sls_config_fix', 'sls_windows_integration', 'sls_install_metadata', 'sls_source_resolver', 'sls_luatools_auth', 'sls_authorized_depot_plan', 'sls_source_list', 'sls_manifest_metadata', 'sls_install_job_queue', 'sls_added_game_registry')) {
            Write-Host "Testing $case"
            & "./build/windows-sls/${case}.exe"
            if ($LASTEXITCODE -ne 0) { throw "Integration test failed: $case" }
          }
          & "./build/windows-sls/sls_zip_inflate.exe"
          if ($LASTEXITCODE -ne 0) { throw "Integration test failed: sls_zip_inflate" }
