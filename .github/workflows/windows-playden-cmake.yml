name: Windows Full Playden Host Port Check
on:
  push:
    branches: [windows-preview]
    paths:
      - 'cmake/**'
      - 'windows-playden/offline_host.cpp'
      - 'cmake/PlaydenCore.cmake'
      - 'cmake/SteamBackend.cmake'
      - 'src/homebrew/host.cpp'
      - 'src/installs/**'
      - 'src/runtime/**'
      - 'src/steam/**'
      - 'src/homebrew/**'
      - 'src/steam/backend/http_client.cpp'
      - 'src/steam/backend/ws_client.cpp'
      - 'src/runtime/artifact_hash.cpp'
      - 'windows-playden/**'
      - '.github/workflows/windows-playden-cmake.yml'
  workflow_dispatch:
concurrency:
  group: windows-playden-cmake-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  configure-host:
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - name: Preserve pinned source bytes on Windows
        shell: pwsh
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: ilammy/msvc-dev-cmd@v1
      - uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.vcpkg-bincache
          key: windows-playden-vcpkg-curl-sdl2-v2
          restore-keys: |
            windows-playden-vcpkg-curl-sdl2-v1
      - name: Install Windows SDL2 and OpenGL development headers
        shell: pwsh
        env:
          VCPKG_BINARY_SOURCES: clear;files,${{ github.workspace }}/.vcpkg-bincache,readwrite
        run: |
          New-Item -ItemType Directory -Force .vcpkg-bincache | Out-Null
          C:\vcpkg\vcpkg.exe install sdl2:x64-windows opengl-registry:x64-windows curl[websockets]:x64-windows mbedtls:x64-windows glew:x64-windows
      - name: Configure native Playden desktop host (experimental)
        shell: pwsh
        run: |
          cmake -S . -B build/windows-playden -G Ninja -DCMAKE_MAKE_PROGRAM=ninja -DCMAKE_C_COMPILER=clang-cl -DCMAKE_CXX_COMPILER=clang-cl -DCMAKE_TOOLCHAIN_FILE=C:/vcpkg/scripts/buildsystems/vcpkg.cmake -DBUILD_TESTING=OFF -DPLAYDEN_PLATFORM_PS5=OFF -DPLAYDEN_WINDOWS_OFFLINE_ONLY=ON -DCMAKE_BUILD_TYPE=Release 2>&1 | Tee-Object windows-playden/cmake-configure.log
          if ($LASTEXITCODE -ne 0) { throw "Windows host CMake configuration has portability blockers" }
      - name: Compile full Playden service host (real Steam backend integration)
        shell: pwsh
        run: |
          # This builds the existing shared Playden host with real backend services,
          # rather than confusing the public-store simulation with a live client.
          # The host intentionally still denies Windows --live-network until
          # private credential storage and file publication are verified.
          cmake --build build/windows-playden --target playden-homebrew --parallel 2 2>&1 |
            Tee-Object windows-playden/full-host-build.log
          if ($LASTEXITCODE -ne 0) {
            throw "Windows full Playden host still has portability blockers; inspect full-host-build.log"
          }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-playden-cmake-logs
          path: windows-playden/*.log
