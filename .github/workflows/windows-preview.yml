name: Windows SLS Den Preview
on:
  push:
    branches: [windows-preview]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: windows-preview-${{ github.ref }}
  cancel-in-progress: true
jobs:
  portable-preview:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Build Win32 source-manager preview
        shell: cmd
        run: |
          mkdir dist
          cl /nologo /std:c++17 /EHsc /DUNICODE /D_UNICODE /I src windows-preview\main.cpp src\sls\source_list.cpp src\sls\source_catalog.cpp /link /SUBSYSTEM:WINDOWS user32.lib comctl32.lib /OUT:dist\sls-den-preview.exe
      - name: Run source-model smoke test
        shell: pwsh
        run: |
          $process = Start-Process -FilePath ".\dist\sls-den-preview.exe" -ArgumentList "--self-test" -PassThru -Wait
          if ($process.ExitCode -ne 0) { throw "Source model smoke test failed ($($process.ExitCode))" }
      - name: Include readme
        shell: pwsh
        run: Copy-Item windows-preview\README.md dist\README.txt
      - uses: actions/upload-artifact@v4
        with:
          name: sls-den-windows-preview
          path: dist/
          if-no-files-found: error
