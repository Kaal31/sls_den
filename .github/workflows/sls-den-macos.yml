name: SLS Den macOS host validation

on:
  push:
    branches: [sls-manifest-integration]
  workflow_dispatch:

concurrency:
  group: sls-den-macos-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  macos-host:
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - name: Configure toolchain
        run: |
          brew install cmake ninja sdl2 pkg-config
          clang++ --version
          cmake --version
      - name: Prepare host network dependencies
        run: scripts/network-deps/prepare-host-deps.sh
      - name: Prepare fonts and configure host build
        run: scripts/build-homebrew.sh --prepare-only
      - name: Configure
        run: cmake --preset homebrew-host
      - name: Build full host suite and desktop simulator
        run: |
          cmake --build --preset homebrew-host --parallel 4
      - name: Run source integration and actual desktop acceptance
        run: |
          ctest --preset homebrew-host --output-on-failure --timeout 180 -R '^(mock_console|sls_|homebrew_source_settings|preferences)'
      - name: Run full host suite
        run: |
          ctest --preset homebrew-host --output-on-failure --timeout 180
      - name: Upload CTest logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sls-den-macos-testlogs
          path: |
            build/homebrew-host/Testing/Temporary/
            build/homebrew-host/mock-console-state.json
            build/homebrew-host/mock-console.png
            build/homebrew-host/mock-console.png.render.json
          if-no-files-found: ignore
  ps5-package:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install cross-build tools
        run: |
          curl -fsSL https://apt.llvm.org/llvm-snapshot.gpg.key | sudo tee /usr/share/keyrings/llvm.asc >/dev/null
          echo 'deb [signed-by=/usr/share/keyrings/llvm.asc] https://apt.llvm.org/noble/ llvm-toolchain-noble-18 main' | sudo tee /etc/apt/sources.list.d/llvm18.list
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build clang-18 llvm-18 lld-18 python3-pil zstd pkg-config libssl-dev
          clang-18 --version | head -n 1 | grep '18.1.8'
      - name: Fetch pinned SDK dependencies
        run: scripts/fetch-deps.sh
      - name: Build title-scoped helper
        run: scripts/build-lapy-helper.sh
      - name: Cross-compile and package PS5 app (no hardware execution)
        run: scripts/build-homebrew-ps5.sh
