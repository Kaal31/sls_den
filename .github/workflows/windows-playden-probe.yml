name: Windows Playden Host Port Probe
on:
  push:
    branches: [windows-preview]
    paths:
      - 'windows-playden/**'
      - 'src/homebrew/simulation.cpp'
      - '.github/workflows/windows-playden-probe.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Install Khronos OpenGL headers
        shell: pwsh
        run: C:\\vcpkg\\vcpkg.exe install opengl-registry:x64-windows
      - name: Probe real Playden simulation compilation
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force windows-playden/out | Out-Null
          clang-cl /nologo /std:c++20 /EHsc /I src /I third_party/ps5-homebrew-ui/src /I third_party/stb /c src/homebrew/simulation.cpp /Fo:windows-playden/out/simulation.obj 2>&1 | Tee-Object windows-playden/out/compiler-output.txt
          if ($LASTEXITCODE -ne 0) {
            Write-Host "Real Playden host requires Windows compatibility work; see compiler output."
            exit 1
          }
      - name: Probe real Playden renderer compilation
        shell: pwsh
        run: |
          clang-cl /nologo /std:c++20 /EHsc /I src /I third_party/ps5-homebrew-ui/src /I third_party/stb /I C:\vcpkg\installed\x64-windows\include /I third_party/ps5-homebrew-ui/third_party/stb /DNOMINMAX /DWIN32_LEAN_AND_MEAN /DGL_GLEXT_PROTOTYPES /c src/homebrew/view.cpp /Fo:windows-playden/out/view.obj 2>&1 | Tee-Object windows-playden/out/renderer-output.txt
          if ($LASTEXITCODE -ne 0) { throw "Playden renderer still needs Windows portability fixes" }
      - name: Build and execute Windows UI platform services smoke test
        shell: pwsh
        run: |
          clang-cl /nologo /std:c++20 /EHsc /I third_party/ps5-homebrew-ui/src windows-playden/platform_host_windows.cpp windows-playden/platform_host_smoke.cpp /Fe:windows-playden/out/platform_host_smoke.exe
          if ($LASTEXITCODE -ne 0) { throw "Windows host platform build failed" }
          & windows-playden/out/platform_host_smoke.exe
          if ($LASTEXITCODE -ne 0) { throw "Windows host platform runtime smoke failed" }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-playden-host-port-probe
          path: windows-playden/out/*.txt
