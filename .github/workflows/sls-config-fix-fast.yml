name: SLS Config Fix Fast Safety Tests
on:
  push:
    branches: [windows-preview]
    paths:
      - 'src/sls/config_fix.*'
      - 'src/sls/game_fix_service.h'
      - 'tests/sls_config_fix_test.cpp'
      - '.github/workflows/sls-config-fix-fast.yml'
  pull_request:
    paths:
      - 'src/sls/config_fix.*'
      - 'src/sls/game_fix_service.h'
      - 'tests/sls_config_fix_test.cpp'
      - '.github/workflows/sls-config-fix-fast.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  safety:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Compile standalone fix engine tests
        run: |
          c++ -std=c++20 -O1 -Wall -Wextra -Isrc tests/sls_config_fix_test.cpp src/sls/config_fix.cpp -o /tmp/sls-config-fix-test
      - name: Run reversible fix safety regression tests
        run: /tmp/sls-config-fix-test
