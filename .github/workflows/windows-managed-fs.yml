name: Windows Managed Filesystem Fast Test
on:
  push:
    branches: [windows-preview]
    paths:
      - 'windows-playden/managed_*'
      - 'windows-playden/identity_smoke.cpp'
      - 'windows-playden/random_id_windows.cpp'
      - 'windows-playden/ntfs_security*'
      - 'windows-playden/storage_*'
      - 'cmake/PlaydenCore.cmake'
      - 'windows-playden/effective_uid_windows.cpp'
      - 'src/platform/managed_directory.h'
      - '.github/workflows/windows-managed-fs.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Validate owner-only NTFS ACL and native file locks
        shell: pwsh
        run: |
          clang-cl /nologo /std:c++20 /EHsc /I windows-playden windows-playden/ntfs_security_smoke.cpp windows-playden/ntfs_security.cpp advapi32.lib /Fe:ntfs_security_smoke.exe
          if ($LASTEXITCODE -ne 0) { throw "NTFS security compilation failed" }
          & ./ntfs_security_smoke.exe
          if ($LASTEXITCODE -ne 0) { throw "NTFS private ACL/lease test failed" }
      - name: Test secure Windows storage API
        shell: pwsh
        run: |
          clang-cl /nologo /std:c++17 /EHsc /I src /I windows-playden windows-playden/storage_smoke.cpp windows-playden/storage_windows.cpp windows-playden/ntfs_security.cpp advapi32.lib /Fe:storage_smoke.exe
          if ($LASTEXITCODE -ne 0) { throw "Windows secure storage compilation failed" }
          & ./storage_smoke.exe
          if ($LASTEXITCODE -ne 0) { throw "Windows secure storage smoke failed" }
      - name: Check Windows identity and randomness
        shell: pwsh
        run: |
          clang-cl /nologo /std:c++20 /EHsc /I src windows-playden/identity_smoke.cpp windows-playden/random_id_windows.cpp windows-playden/effective_uid_windows.cpp bcrypt.lib /Fe:identity_smoke.exe
          if ($LASTEXITCODE -ne 0) { throw "Windows identity smoke build failed" }
          & ./identity_smoke.exe
          if ($LASTEXITCODE -ne 0) { throw "Windows identity smoke test failed" }
      - name: Compile and run offline Windows filesystem policy test
        shell: pwsh
        run: |
          clang-cl /nologo /std:c++20 /EHsc /I src windows-playden/managed_filesystem_smoke.cpp windows-playden/managed_directory_windows.cpp windows-playden/managed_file_lock_windows.cpp windows-playden/ntfs_security.cpp advapi32.lib /Fe:managed_filesystem_smoke.exe
          if ($LASTEXITCODE -ne 0) { throw "Windows managed filesystem compilation failed" }
          & ./managed_filesystem_smoke.exe
          if ($LASTEXITCODE -ne 0) { throw "Windows managed filesystem test failed" }
