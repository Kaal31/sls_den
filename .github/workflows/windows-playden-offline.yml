name: Windows Application Build and UI
on:
  push:
    branches: [windows-preview]
    paths:
      - 'windows-playden/**'
      - 'src/homebrew/**'
      - 'src/sls/**'
      - 'src/runtime/**'
      - 'src/platform/**'
      - 'src/app/**'
      - 'src/steam/**'
      - 'src/stores/**'
      - 'src/update/**'
      - '.github/workflows/windows-playden-cmake.yml'
      - 'cmake/**'
      - '.github/workflows/windows-playden-offline.yml'
  workflow_dispatch:
concurrency:
  group: playden-windows-app-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  windows-application:
    name: Windows UI previews and full host
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - name: Preserve exact pinned source contents
        shell: pwsh
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: ilammy/msvc-dev-cmd@v1
      - uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.vcpkg-bincache
          key: windows-offline-vcpkg-sdl2-opengl-mbedtls-curl-glew-v3
      - name: Install Windows GUI and crypto dependencies
        shell: pwsh
        env:
          VCPKG_BINARY_SOURCES: clear;files,${{ github.workspace }}/.vcpkg-bincache,readwrite
        run: |
          New-Item -ItemType Directory -Force .vcpkg-bincache | Out-Null
          C:\vcpkg\vcpkg.exe install sdl2:x64-windows opengl-registry:x64-windows mbedtls:x64-windows curl[websockets]:x64-windows glew:x64-windows
      - name: Configure Windows UI previews and shared host target
        shell: pwsh
        run: |
          cmake -S . -B build/windows-offline -G Ninja -DCMAKE_MAKE_PROGRAM=ninja -DCMAKE_C_COMPILER=clang-cl -DCMAKE_CXX_COMPILER=clang-cl -DCMAKE_TOOLCHAIN_FILE=C:/vcpkg/scripts/buildsystems/vcpkg.cmake -DBUILD_TESTING=OFF -DPLAYDEN_PLATFORM_PS5=OFF -DPLAYDEN_WINDOWS_OFFLINE_ONLY=ON -DCMAKE_BUILD_TYPE=Release -DCMAKE_EXPORT_COMPILE_COMMANDS=ON 2>&1 | Tee-Object windows-playden/offline-configure.log
          if ($LASTEXITCODE -ne 0) { throw "Windows offline Playden configure failed" }
      - name: Inventory Unix-only dependencies in configured Windows sources
        shell: pwsh
        run: |
          python windows-playden/audit_windows_posix.py build/windows-offline/compile_commands.json |
            Tee-Object windows-playden/windows-posix-audit.log
          if ($LASTEXITCODE -ne 0) { throw "Windows POSIX dependency inventory failed" }
      - name: Build simulated UI and public Steam catalogue preview
        shell: pwsh
        run: |
          cmake --build build/windows-offline --target playden-windows-offline playden-windows-online --parallel 3 2>&1 | Tee-Object windows-playden/offline-compile.log
          if ($LASTEXITCODE -ne 0) { throw "Windows offline Playden compile/link failed" }
      - name: Test SLS to Playden authorization and manifest handoff
        shell: pwsh
        run: |
          cmake --build build/windows-offline --target sls_playden_handoff_test --parallel 3
          if ($LASTEXITCODE -ne 0) { throw "SLS handoff fixture compilation failed" }
          & build/windows-offline/sls_playden_handoff_test.exe
          if ($LASTEXITCODE -ne 0) { throw "SLS to Playden handoff contract failed" }
      - name: Smoke-test native simulation process
        shell: pwsh
        run: |
          $env:PATH = "C:\vcpkg\installed\x64-windows\bin;" + $env:PATH
          $exe = (Resolve-Path "build/windows-offline/playden-windows-offline.exe").Path
          function Invoke-BoundedTest([string] $label, [string[]] $arguments, [int] $maxSeconds = 120) {
            Write-Host "::group::TEST $label (timeout ${maxSeconds}s)"
            $out = Join-Path $env:RUNNER_TEMP ("lua-den-" + $label + ".stdout.log")
            $err = Join-Path $env:RUNNER_TEMP ("lua-den-" + $label + ".stderr.log")
            $process = Start-Process -FilePath $exe -ArgumentList $arguments -PassThru -NoNewWindow -RedirectStandardOutput $out -RedirectStandardError $err
            try {
              if (-not $process.WaitForExit($maxSeconds * 1000)) {
                Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
                throw "TIMEOUT: $label did not finish within ${maxSeconds}s"
              }
              $process.WaitForExit()
              if ($process.ExitCode -ne 0) {
                throw "FAILED: $label exited with code $($process.ExitCode)"
              }
            } finally {
              if (Test-Path $out) { Get-Content $out }
              if (Test-Path $err) { Get-Content $err }
              $startup = Join-Path (Split-Path $exe -Parent) "sls-den-startup.log"
              if (Test-Path $startup) {
                Write-Host "Last 60 startup log lines for $label"
                Get-Content $startup -Tail 60
              }
              Write-Host "::endgroup::"
            }
            Write-Host "PASS: $label"
          }
          Invoke-BoundedTest "default" @("--self-test")
          Invoke-BoundedTest "first-run" @("--scenario", "first-run", "--self-test")
          Invoke-BoundedTest "offline" @("--scenario", "offline", "--self-test")
          Invoke-BoundedTest "navigation" @("--navigation-self-test", "--self-test") 180
      - name: Bundle offline Playden simulation
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force windows-playden/offline-dist | Out-Null
          Copy-Item build/windows-offline/playden-windows-offline.exe windows-playden/offline-dist
          Copy-Item build/windows-offline/homebrew-assets windows-playden/offline-dist/homebrew-assets -Recurse
          Copy-Item fixtures/ui-comparison windows-playden/offline-dist/fixtures -Recurse
          Get-ChildItem "C:\vcpkg\installed\x64-windows\bin" -Filter "*.dll" |
            Copy-Item -Destination windows-playden/offline-dist
          @"
          Lua Den Windows - real Playden offline UI (simulation only).
          Extract the ENTIRE archive; keep the DLLs, homebrew-assets and fixtures beside the exe.
          Double-click playden-windows-offline.exe. If the window closes, look for:
            sls-den-startup.log in the same folder as the .exe
          If the folder is read-only, the log falls back to the Windows TEMP folder.
          For a persistent console error message, open Command Prompt in this directory and run:
            playden-windows-offline.exe
          No Steam login, downloads, or game installation.
          "@ | Set-Content windows-playden/offline-dist/README.txt
      - name: Bundle opt-in public Steam Store online preview
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force windows-playden/online-dist | Out-Null
          Copy-Item build/windows-offline/playden-windows-online.exe windows-playden/online-dist
          Copy-Item build/windows-offline/homebrew-assets windows-playden/online-dist/homebrew-assets -Recurse
          Copy-Item fixtures/ui-comparison windows-playden/online-dist/fixtures -Recurse
          Get-ChildItem "C:\vcpkg\installed\x64-windows\bin" -Filter "*.dll" |
            Copy-Item -Destination windows-playden/online-dist
          @"
          Lua Den - Windows public Steam Store online preview.
          Live: search the public Steam Store. No login or game downloads.
          Simulated only: installation, preparation, launch, uninstall and Fixes.
          HTTPS lookup failures leave existing simulated library and other results alone.
          Extract all files together and run playden-windows-online.exe.
          "@ | Set-Content windows-playden/online-dist/README.txt
          $env:PATH = "windows-playden/online-dist;C:\vcpkg\installed\x64-windows\bin;" + $env:PATH
          & build/windows-offline/playden-windows-online.exe --self-test
          if ($LASTEXITCODE -ne 0) { throw "Windows online preview self-test failed" }
      - name: Verify packaged offline dependencies and UI assets
        shell: pwsh
        run: |
          $dir = "windows-playden/offline-dist"
          $required = @(
            "$dir/playden-windows-offline.exe",
            "$dir/homebrew-assets/fonts/barlow-regular.huifont",
            "$dir/homebrew-assets/fonts/barlow-semibold.huifont",
            "$dir/homebrew-assets/fonts/barlow-condensed-semibold.huifont",
            "$dir/homebrew-assets/fonts/noto-greek-fallback.huifont",
            "$dir/fixtures/catalog.json",
            "$dir/fixtures/scenarios.json",
            "$dir/SDL2.dll"
          )
          foreach ($item in $required) {
            if (-not (Test-Path $item)) { throw "Offline UI package missing: $item" }
          }
          $deps = & dumpbin /dependents "$dir/playden-windows-offline.exe"
          if ($LASTEXITCODE -ne 0) { throw "Cannot inspect Windows executable import table" }
          $deps | Set-Content "windows-playden/offline-dll-dependencies.txt"
          Write-Host "Offline simulation has native curl linkage; network operations remain disabled by the host."
          Write-Host "Packaged offline UI assets verified"
      - name: Run packaged app in Unicode-named Windows directory
        shell: pwsh
        run: |
          $source = (Resolve-Path "windows-playden/offline-dist").Path
          $unicodeRoot = Join-Path $env:RUNNER_TEMP "Финансовый партнёр 漢字"
          $destination = Join-Path $unicodeRoot "playden-windows-real-ui-offline"
          New-Item -ItemType Directory -Force $destination | Out-Null
          Copy-Item "$source/*" -Destination $destination -Recurse -Force
          $exe = Join-Path $destination "playden-windows-offline.exe"
          $env:PATH = "$destination;C:\vcpkg\installed\x64-windows\bin;" + $env:PATH
          & $exe --validate-assets --self-test
          if ($LASTEXITCODE -ne 0) {
            $log = Join-Path $destination "sls-den-startup.log"
            if (Test-Path $log) { Get-Content $log }
            throw "Packaged Windows Playden could not initialize from Unicode directory"
          }
          $log = Join-Path $destination "sls-den-startup.log"
          if (-not (Test-Path $log)) { throw "Packaged executable did not create startup log" }
          $text = Get-Content $log -Raw -Encoding utf8
          if ($text -notmatch "Packaged renderer font files verified" -or $text -notmatch "Simulation self-test passed") {
            throw "Missing expected Unicode package asset and simulation validation milestones"
          }
          Write-Host "PASS: packaged renderer resources and model initialize from Unicode folder"
      - uses: actions/upload-artifact@v4
        with:
          name: playden-windows-real-ui-offline
          path: windows-playden/offline-dist/**
      - uses: actions/upload-artifact@v4
        with:
          name: playden-windows-public-store-online
          path: windows-playden/online-dist/**
      - name: Compile full shared Playden host (portability gate)
        shell: pwsh
        run: |
          # Same configured toolchain and cached dependencies as the UI build.
          # Does not enable --live-network or publish PS5 titles.
          cmake --build build/windows-offline --target playden-homebrew --parallel 2 2>&1 |
            Tee-Object windows-playden/full-host-build.log
          if ($LASTEXITCODE -ne 0) {
            throw "Shared host compile failed; inspect full-host-build.log for the next portability error"
          }
      - name: Verify Windows full-host entrypoint and reject unsupported live credentials
        shell: pwsh
        run: |
          $env:PATH = "C:\\vcpkg\\installed\\x64-windows\\bin;" + $env:PATH
          $exe = (Resolve-Path "build/windows-offline/playden-homebrew.exe").Path
          # Exercise the linked executable without requiring a GPU or a Steam account.
          & $exe --help 2>&1 | Tee-Object -Variable helpText
          if ($LASTEXITCODE -ne 0 -or (($helpText | Out-String) -notmatch "usage:")) {
            throw "Windows shared host CLI entrypoint failed"
          }
          $message = & $exe --live-network 2>&1 | Out-String
          $exit = $LASTEXITCODE
          if ($exit -ne 2 -or $message -notmatch "live networking is disabled") {
            throw "Windows host did not fail closed on live networking: exit=$exit output=$message"
          }
          Write-Host "PASS: Windows full host launches its CLI and rejects unsupported live Steam credentials"
      - name: Verify online preview simulation states
        shell: pwsh
        run: |
          $env:PATH = "C:\\vcpkg\\installed\\x64-windows\\bin;" + $env:PATH
          $exe = (Resolve-Path "build/windows-offline/playden-windows-online.exe").Path
          foreach ($scenario in @("first-run", "offline")) {
            & $exe --scenario $scenario --self-test
            if ($LASTEXITCODE -ne 0) { throw "Online preview simulation failed scenario $scenario" }
          }
          & $exe --navigation-self-test --self-test
          if ($LASTEXITCODE -ne 0) { throw "Online preview navigation self-test failed" }
          Write-Host "PASS: public Store preview offline-safe simulation and navigation"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-playden-offline-build-logs
          path: |
            windows-playden/offline-*.log
            windows-playden/full-host-build.log
            windows-playden/offline-dll-dependencies.txt
